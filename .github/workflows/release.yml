name: Build and Sign Nextcloud App Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'manuelbernalcarvajal'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          path: pwa_suite

      - name: Package and sign the app
        env:
          PRIVATE_KEY: ${{ secrets.NC_PRIVATE_KEY }}
        run: |
          mkdir -p build/artifacts
          
          # 1. Package the folder, excluding Git files and workflows
          tar --exclude='pwa_suite/.git*' --exclude='pwa_suite/.github' -czf build/artifacts/pwa_suite.tar.gz pwa_suite
          
          # 2. Temporarily store the private signing key
          echo "$PRIVATE_KEY" > key.pem
          
          # 3. Sign the archive and save the signature to a text file
          openssl dgst -sha512 -sign key.pem build/artifacts/pwa_suite.tar.gz | openssl base64 > build/artifacts/pwa_suite.sig
          
          # 4. Remove the temporary key for safety
          rm -f key.pem

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/artifacts/pwa_suite.tar.gz
            build/artifacts/pwa_suite.sig
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
